name: Issue Auto Labeler

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Auto-label based on issue form
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DEV_CHANNEL: ${{ secrets.SLACK_DEV_CHANNEL }}
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const labels = [];

            // 시작 팀 드롭다운에서 area 라벨 추출
            const teamMatch = body.match(/### 시작 팀\s*\n\s*(.+)/);
            if (teamMatch) {
              const team = teamMatch[1].trim();
              const teamLabelMap = {
                '기획팀': 'area:planning',
                '개발팀': 'area:dev',
                '법무팀': 'area:legal',
                '마케팅팀': 'area:marketing'
              };
              if (teamLabelMap[team]) {
                labels.push(teamLabelMap[team]);
              }
            }

            // 우선순위 드롭다운에서 라벨 추출
            const priorityMatch = body.match(/### 우선순위\s*\n\s*(.+)/);
            if (priorityMatch) {
              const priority = priorityMatch[1].trim();
              if (priority.startsWith('p0')) labels.push('p0');
              else if (priority.startsWith('p1')) labels.push('p1');
              else if (priority.startsWith('p2')) labels.push('p2');
            }

            // AI 기능 드롭다운에서 feature:ai 라벨 추출
            const aiMatch = body.match(/### AI 기능 포함 여부\s*\n\s*(.+)/);
            if (aiMatch && aiMatch[1].trim() === '예') {
              labels.push('feature:ai');
            }

            // 라벨 추가
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });

              core.info(`Added labels: ${labels.join(', ')}`);

              // GITHUB_TOKEN으로 라벨 추가 시 handoff.yml이 트리거되지 않으므로
              // 인라인 Slack 알림으로 새 이슈 생성을 알림
              const slackToken = process.env.SLACK_BOT_TOKEN;
              const channel = process.env.SLACK_DEV_CHANNEL;
              if (!slackToken || !channel) {
                core.info('Slack 시크릿 미설정 — 알림 생략');
                return;
              }

              const teamEmoji = {
                'area:dev': ':hammer_and_wrench:',
                'area:planning': ':clipboard:',
                'area:legal': ':scales:',
                'area:marketing': ':chart_with_upwards_trend:'
              };

              const labelText = labels.map(l => `\`${l}\``).join(' ');
              const areaLabel = labels.find(l => l.startsWith('area:'));
              const emoji = areaLabel ? (teamEmoji[areaLabel] || ':label:') : ':label:';

              try {
                const resp = await fetch('https://slack.com/api/chat.postMessage', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${slackToken}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    channel,
                    text: `${emoji} *새 이슈 등록*\n이슈: <${issue.html_url}|#${issue.number}> ${issue.title}\n라벨: ${labelText}`
                  })
                });
                const result = await resp.json();
                if (!result.ok) core.warning(`Slack 알림 실패: ${result.error}`);
              } catch (e) {
                core.warning(`Slack 알림 실패: ${e.message}`);
              }
            }
