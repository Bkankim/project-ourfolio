name: Quality - Bundle Size

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '22'

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Analyze bundle size
        uses: hashicorp/nextjs-bundle-analysis@v1
        with:
          workflow-id: 'bundle-size.yml'
          base-branch: 'main'
