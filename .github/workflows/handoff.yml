name: Team Handoff Notification

on:
  issues:
    types: [labeled, unlabeled]

permissions:
  issues: write

jobs:
  handoff-notify:
    if: github.event.action == 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect area label and notify
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DEV_CHANNEL: ${{ secrets.SLACK_DEV_CHANNEL }}
          SLACK_PLANNING_CHANNEL: ${{ secrets.SLACK_PLANNING_CHANNEL }}
          SLACK_LEGAL_CHANNEL: ${{ secrets.SLACK_LEGAL_CHANNEL }}
          SLACK_MARKETING_CHANNEL: ${{ secrets.SLACK_MARKETING_CHANNEL }}
        with:
          script: |
            const label = context.payload.label.name;
            const issue = context.payload.issue;

            // area 라벨이 아니면 무시
            if (!label.startsWith('area:')) return;

            const channelMap = {
              'area:dev': process.env.SLACK_DEV_CHANNEL,
              'area:planning': process.env.SLACK_PLANNING_CHANNEL || process.env.SLACK_DEV_CHANNEL,
              'area:legal': process.env.SLACK_LEGAL_CHANNEL || process.env.SLACK_DEV_CHANNEL,
              'area:marketing': process.env.SLACK_MARKETING_CHANNEL || process.env.SLACK_DEV_CHANNEL
            };

            const teamMap = {
              'area:dev': { name: '개발팀', emoji: ':hammer_and_wrench:' },
              'area:planning': { name: '기획팀', emoji: ':clipboard:' },
              'area:legal': { name: '법무팀', emoji: ':scales:' },
              'area:marketing': { name: '마케팅팀', emoji: ':chart_with_upwards_trend:' }
            };

            const team = teamMap[label];
            if (!team) return;

            // 기존 area:* 라벨 중복 제거
            const allAreaLabels = ['area:dev', 'area:planning', 'area:legal', 'area:marketing'];
            const currentLabels = issue.labels.map(l => l.name);
            for (const areaLabel of allAreaLabels) {
              if (areaLabel !== label && currentLabels.includes(areaLabel)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: areaLabel
                  });
                } catch (e) {
                  core.warning(`area 라벨 제거 실패: ${areaLabel} - ${e.message}`);
                }
              }
            }

            // Slack 알림 발송 (시크릿 미설정 시 건너뜀)
            const slackToken = process.env.SLACK_BOT_TOKEN;
            const channel = channelMap[label] || process.env.SLACK_DEV_CHANNEL;
            if (slackToken && channel) {
              try {
                await fetch('https://slack.com/api/chat.postMessage', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${slackToken}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    channel: channel,
                    text: `${team.emoji} *핸드오프: ${team.name}*\n이슈: <${issue.html_url}|#${issue.number}> ${issue.title}\n담당 변경됨 → ${team.name} 확인 필요`
                  })
                });
              } catch (e) {
                core.warning(`Slack 알림 실패: ${e.message}`);
              }
            } else {
              core.info('Slack 시크릿 미설정 — 알림 건너뜀');
            }

            // 이슈에 핸드오프 코멘트 추가
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `**${team.emoji} 핸드오프 → ${team.name}**\n\n이 이슈가 ${team.name}으로 전달되었습니다.`
            });

  blocked-cleanup:
    if: >-
      github.event.action == 'unlabeled' &&
      github.event.label.name == 'state:blocked'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove needs:input when state:blocked is removed
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'needs:input'
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              // Label not present — ignore
            }

  blocked-auto-label:
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'state:blocked'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add needs:input label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['needs:input']
            });
