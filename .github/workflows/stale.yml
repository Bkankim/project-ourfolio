name: Stale Issues

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 오전 9시 KST (UTC 00:00)

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: |
            ⏰ 이 이슈는 30일 동안 활동이 없어 `stale`로 표시되었습니다.
            7일 내에 응답이 없으면 자동으로 닫힙니다.
          stale-pr-message: |
            ⏰ 이 PR은 14일 동안 활동이 없어 `stale`로 표시되었습니다.
            7일 내에 응답이 없으면 자동으로 닫힙니다.
          close-issue-message: |
            🔒 활동이 없어 이슈를 닫습니다. 필요하면 다시 열어주세요.
          close-pr-message: |
            🔒 활동이 없어 PR을 닫습니다. 필요하면 다시 열어주세요.
          
          days-before-stale: 30
          days-before-close: 7
          days-before-pr-stale: 14
          days-before-pr-close: 7
          
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          
          # 이 라벨이 있으면 stale 처리 안 함
          exempt-issue-labels: 'p0,p1,state:blocked,pinned'
          exempt-pr-labels: 'p0,p1,do-not-close'
          
          # Draft PR은 stale 처리 안 함
          exempt-draft-pr: true
