name: Slack Notifications

on:
  # PR 생성/병합 시 알림
  pull_request:
    types: [opened, closed]
  
  # 릴리즈 시 알림
  release:
    types: [published]

permissions: {}

jobs:
  pr-notification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: PR Opened
        if: ${{ github.event.action == 'opened' && env.SLACK_BOT_TOKEN != '' }}
        uses: slackapi/slack-github-action@v3.0.3
        with:
          channel-id: ${{ secrets.SLACK_DEV_CHANNEL }}
          slack-message: |
            📝 *새 PR*
            제목: ${{ github.event.pull_request.title }}
            작성자: ${{ github.event.pull_request.user.login }}
            링크: ${{ github.event.pull_request.html_url }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: PR Merged
        if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true && env.SLACK_BOT_TOKEN != '' }}
        uses: slackapi/slack-github-action@v3.0.3
        with:
          channel-id: ${{ secrets.SLACK_DEV_CHANNEL }}
          slack-message: |
            ✅ *PR 병합됨*
            제목: ${{ github.event.pull_request.title }}
            브랜치: `${{ github.event.pull_request.head.ref }}` → `main`
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  release-notification:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Release Published
        if: ${{ env.SLACK_BOT_TOKEN != '' }}
        uses: slackapi/slack-github-action@v3.0.3
        with:
          channel-id: ${{ secrets.SLACK_DEPLOY_CHANNEL }}
          slack-message: |
            🎉 *새 릴리즈*
            버전: ${{ github.event.release.tag_name }}
            이름: ${{ github.event.release.name }}
            링크: ${{ github.event.release.html_url }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
