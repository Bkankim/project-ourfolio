name: Blocked Escalation

on:
  schedule:
    - cron: '5 0 * * 1-5'  # 평일 09:05 KST (UTC 00:05) — daily-briefing과 5분 간격

permissions:
  issues: read

jobs:
  check-blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check blocked issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'state:blocked',
              state: 'open'
            });

            if (!process.env.SLACK_BOT_TOKEN || !process.env.SLACK_BK_USER_ID) {
              core.warning('SLACK_BOT_TOKEN 또는 SLACK_BK_USER_ID 미설정 — Slack 알림 건너뜀');
              return;
            }

            const now = new Date();

            for (const issue of issues.data) {
              // Events API로 state:blocked 라벨이 실제로 추가된 시점 조회
              // (updated_at은 코멘트/수정으로 리셋되어 부정확)
              const events = await github.rest.issues.listEvents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });

              const blockedEvent = events.data
                .filter(e => e.event === 'labeled' && e.label?.name === 'state:blocked')
                .pop();

              if (!blockedEvent) continue;

              const blockedAt = new Date(blockedEvent.created_at);
              const hoursBlocked = (now - blockedAt) / (1000 * 60 * 60);
              if (hoursBlocked < 24) continue;

              const response = await fetch('https://slack.com/api/chat.postMessage', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.SLACK_BOT_TOKEN}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  channel: process.env.SLACK_BK_USER_ID,
                  text: `⏰ *24h+ 블로커*\n이슈: <${issue.html_url}|#${issue.number}>\n제목: ${issue.title}`
                })
              });
              const result = await response.json();
              if (!result.ok) {
                core.warning(`Slack API 실패: ${result.error}`);
              }
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_BK_USER_ID: ${{ secrets.SLACK_BK_USER_ID }}
