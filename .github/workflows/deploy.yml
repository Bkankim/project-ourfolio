name: Deploy (Mirror)

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'bkan-hq/project-ourfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Mirror to personal repo
        run: |
          git remote add mirror git@github.com:Bkankim/project-ourfolio.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" git push mirror master --force

      - name: Notify Slack - Mirror Failure
        if: failure() && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@v3.0.3
        with:
          channel-id: ${{ secrets.SLACK_BK_USER_ID }}
          slack-message: |
            :rotating_light: *미러 실패* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그>
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  health-check:
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Wait for Vercel build
        run: sleep 60

      - name: Health Check
        run: |
          CHECK_URL="https://ourfolio.bkan.dev"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$CHECK_URL" || true)
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "ERROR: Health check failed after 5 attempts (HTTP $STATUS)"
          exit 1

      - name: Notify Slack - Success
        if: env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@v3.0.3
        with:
          channel-id: ${{ secrets.SLACK_DEPLOY_CHANNEL }}
          slack-message: |
            :rocket: *배포 완료* `${{ github.sha }}`
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Notify Slack - Failure
        if: failure() && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@v3.0.3
        with:
          channel-id: ${{ secrets.SLACK_BK_USER_ID }}
          slack-message: |
            :rotating_light: *배포 실패* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그>
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
