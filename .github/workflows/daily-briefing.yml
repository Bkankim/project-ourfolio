name: Daily CEO Briefing

on:
  schedule:
    - cron: '0 0 * * 1-5'  # 평일 09:00 KST (UTC 00:00)
  workflow_dispatch:          # GitHub UI에서 수동 실행 가능

permissions:
  issues: write
  pull-requests: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Slack token health
        id: slack-health
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          script: |
            const token = process.env.SLACK_BOT_TOKEN;

            if (!token) {
              core.warning('SLACK_BOT_TOKEN 미설정');
              core.setOutput('healthy', 'missing');
              return;
            }

            try {
              const res = await fetch('https://slack.com/api/auth.test', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Content-Type': 'application/x-www-form-urlencoded'
                }
              });
              const data = await res.json();

              if (data.ok) {
                console.log(`Slack 토큰 정상: team=${data.team}, user=${data.user}`);
                core.setOutput('healthy', 'true');
              } else {
                core.warning(`Slack 토큰 오류: ${data.error}`);
                core.setOutput('healthy', 'false');
                core.setOutput('error', data.error);
              }
            } catch (e) {
              core.warning(`Slack API 호출 실패: ${e.message}`);
              core.setOutput('healthy', 'error');
            }

      - name: Create alert issue if Slack unhealthy
        if: steps.slack-health.outputs.healthy != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.slack-health.outputs.healthy }}';
            const error = '${{ steps.slack-health.outputs.error }}';

            // 중복 이슈 방지: 열린 이슈 중 동일 제목 검색
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'p0,area:dev',
              per_page: 100
            });
            const title = 'Slack 토큰 헬스체크 실패';
            if (existing.data.some(i => i.title === title)) {
              console.log('이미 열린 이슈 존재 — 건너뜀');
              return;
            }

            let body = `## Slack 토큰 헬스체크 실패\n\n`;
            if (status === 'missing') {
              body += `**상태**: \`SLACK_BOT_TOKEN\` 시크릿 미설정\n`;
              body += `**영향**: 모든 Slack 알림 (핸드오프, P0, 일일 브리핑) 무음 상태\n`;
            } else {
              body += `**상태**: 토큰 오류 — \`${error}\`\n`;
              body += `**영향**: Slack API 인증 실패, 모든 알림 중단\n`;
            }
            body += `\n### 조치\n`;
            body += `1. GitHub Settings > Secrets에서 \`SLACK_BOT_TOKEN\` 확인\n`;
            body += `2. Slack App 설정에서 토큰 재발급 (필요 시)\n`;
            body += `3. 이 이슈를 닫으면 다음 헬스체크에서 재생성되지 않음\n`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['p0', 'area:dev']
            });
            console.log('알림 이슈 생성 완료');

      - name: Collect stats and send briefing
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_BK_USER_ID: ${{ secrets.SLACK_BK_USER_ID }}
        with:
          script: |
            // --- Slack 시크릿 확인 (graceful skip) ---
            if (!process.env.SLACK_BOT_TOKEN || !process.env.SLACK_BK_USER_ID) {
              console.log('Slack 시크릿 미설정 - 건너뜀');
              return;
            }

            // Chunked parallel execution helper
            async function chunked(items, batchSize, fn) {
              const results = [];
              for (let i = 0; i < items.length; i += batchSize) {
                const batch = items.slice(i, i + batchSize);
                results.push(...await Promise.all(batch.map(fn)));
              }
              return results;
            }

            const owner = context.repo.owner;
            const now = new Date();
            const yesterday = new Date(now - 24 * 60 * 60 * 1000).toISOString();

            // --- 1. org 내 레포 목록 (GITHUB_TOKEN 범위 내) ---
            let repos;
            try {
              const repoList = await github.rest.repos.listForOrg({
                org: owner, type: 'all', per_page: 100
              });
              repos = repoList.data;
            } catch (e) {
              // org 쿼리 실패 시 현재 레포만 사용
              console.log(`org 쿼리 실패 (${e.message}), 현재 레포만 사용`);
              repos = [{ name: context.repo.repo }];
            }

            // --- 2. 레포별 이슈 수집 (chunked) ---
            const allIssues = [];
            const repoStats = [];
            await chunked(repos, 5, async (r) => {
              try {
                const openIssues = await github.rest.issues.listForRepo({
                  owner, repo: r.name, state: 'open', per_page: 100
                });
                const issues = openIssues.data.filter(i => !i.pull_request);
                for (const i of issues) {
                  allIssues.push({ ...i, repoName: r.name });
                }
                if (issues.length > 0) {
                  const hasLabel = (issue, name) => issue.labels.some(l => l.name === name);
                  repoStats.push({
                    name: r.name,
                    open: issues.length,
                    inProgress: issues.filter(i => hasLabel(i, 'state:in-progress')).length,
                    blocked: issues.filter(i => hasLabel(i, 'state:blocked')).length
                  });
                }
              } catch (e) {
                console.log(`${r.name}: 이슈 조회 실패 — ${e.message}`);
              }
              return null;
            });

            const hasLabel = (issue, name) => issue.labels.some(l => l.name === name);
            const p0 = allIssues.filter(i => hasLabel(i, 'p0'));
            const p1 = allIssues.filter(i => hasLabel(i, 'p1'));
            const p2 = allIssues.filter(i => hasLabel(i, 'p2'));
            const inProgress = allIssues.filter(i => hasLabel(i, 'state:in-progress'));
            const inReview = allIssues.filter(i => hasLabel(i, 'state:review'));
            const blocked = allIssues.filter(i => hasLabel(i, 'state:blocked'));
            const areaDev = allIssues.filter(i => hasLabel(i, 'area:dev'));
            const areaPlanning = allIssues.filter(i => hasLabel(i, 'area:planning'));
            const areaLegal = allIssues.filter(i => hasLabel(i, 'area:legal'));
            const areaMarketing = allIssues.filter(i => hasLabel(i, 'area:marketing'));

            // --- 3+4. 닫힌 이슈 + PR 현황 (3-way parallel, safe) ---
            const [closedIssues, openPRs, closedPRs] = await Promise.all([
              github.rest.issues.listForRepo({
                owner, repo: context.repo.repo, state: 'closed', since: yesterday, per_page: 100
              }),
              github.rest.pulls.list({
                owner, repo: context.repo.repo, state: 'open', per_page: 100
              }),
              github.rest.pulls.list({
                owner, repo: context.repo.repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 20
              })
            ]);
            const recentClosed = closedIssues.data.filter(i => !i.pull_request);
            const recentMerged = closedPRs.data.filter(pr =>
              pr.merged_at && new Date(pr.merged_at) > new Date(yesterday)
            );
            let mergeReady = 0;
            await chunked(openPRs.data, 3, async (pr) => {
              try {
                const reviews = await github.rest.pulls.listReviews({
                  owner, repo: context.repo.repo, pull_number: pr.number
                });
                if (reviews.data.some(r => r.state === 'APPROVED')) mergeReady++;
              } catch (e) {
                console.log(`PR #${pr.number}: 리뷰 조회 실패 — ${e.message}`);
              }
              return null;
            });

            // --- 5. 주의 항목 ---
            const twentyFourHours = 24 * 60 * 60 * 1000;
            const alerts = [];
            for (const issue of blocked) {
              const hours = Math.round((now - new Date(issue.updated_at)) / (60 * 60 * 1000));
              if (now - new Date(issue.updated_at) > twentyFourHours) {
                alerts.push(`[BLOCKED ${hours}h] <${issue.html_url}|#${issue.number}> ${issue.title}`);
              }
            }
            for (const issue of p0) {
              alerts.push(`[P0] <${issue.html_url}|#${issue.number}> ${issue.title}`);
            }
            for (const issue of p1) {
              alerts.push(`[P1] <${issue.html_url}|#${issue.number}> ${issue.title}`);
            }

            // --- 6. 메시지 구성 ---
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const kstDate = new Date(now.getTime() + 9 * 60 * 60 * 1000);
            const dateStr = `${kstDate.toISOString().slice(0, 10)} (${days[kstDate.getUTCDay()]})`;

            let msg = `:sunrise: *일일 브리핑* — ${dateStr}\n\n`;

            // 이슈 현황
            if (allIssues.length === 0) {
              msg += `:white_check_mark: *이슈 없음*\n\n`;
            } else {
              msg += `:bar_chart: *이슈 현황 (org 전체)*\n`;
              msg += `• 총 열린: ${allIssues.length}건 (P0: ${p0.length} | P1: ${p1.length} | P2: ${p2.length})\n`;
              msg += `• 진행 중: ${inProgress.length} | 리뷰: ${inReview.length} | 블로커: ${blocked.length}\n`;
              msg += `• 어제 닫힘: ${recentClosed.length}건\n\n`;

              // 레포별 현황 (Slack mrkdwn 리스트)
              if (repoStats.length > 1) {
                msg += `*레포별:*\n`;
                for (const rs of repoStats) {
                  msg += `• \`${rs.name}\` — 열린: ${rs.open} | 진행중: ${rs.inProgress} | 블로커: ${rs.blocked}\n`;
                }
                msg += `\n`;
              }
            }

            // PR 현황
            msg += `:arrows_counterclockwise: *PR 현황*\n`;
            msg += `• 열린: ${openPRs.data.length}건 | 머지 대기: ${mergeReady} | 어제 머지: ${recentMerged.length}\n\n`;

            // 주의 항목
            if (alerts.length > 0) {
              msg += `:rotating_light: *주의 항목*\n`;
              const shown = alerts.slice(0, 5);
              for (const a of shown) msg += `• ${a}\n`;
              if (alerts.length > 5) msg += `• _외 ${alerts.length - 5}건_\n`;
              msg += `\n`;
            }

            // 팀별 분배
            msg += `:clipboard: *팀별*  개발: ${areaDev.length} | 기획: ${areaPlanning.length} | 법무: ${areaLegal.length} | 마케팅: ${areaMarketing.length}\n\n`;
            msg += `> 수동 브리핑: "현황 보고" 명령`;

            // --- 7. Slack DM 전송 ---
            const response = await fetch('https://slack.com/api/chat.postMessage', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.SLACK_BOT_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                channel: process.env.SLACK_BK_USER_ID,
                text: msg
              })
            });

            const result = await response.json();
            if (!result.ok) {
              console.log(`Slack 전송 실패: ${result.error}`);
            } else {
              console.log('브리핑 전송 완료');
            }
